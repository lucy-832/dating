<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0406;
    --bg-deep: #030102;
    --red-bright: #ff3b3b;
    --red-mid: #b3122a;
    --red-deep: #380007;
    --rose: #ff8fa3;
    --gold: #ffcf8f;
    --ink: #fce9e9;
    --muted: #b58a8d;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    overflow:hidden;
    font-family: 'Jost', sans-serif;
    color: var(--ink);
  }

  .stage{
    position:relative;
    width:100vw; height:100vh;
    overflow:hidden;
  }

  /* ---------- animated ambient backdrop ---------- */
  .backdrop{
    position:absolute; inset:-10%;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,59,59,.16), transparent 45%),
      radial-gradient(circle at 75% 70%, rgba(255,143,163,.12), transparent 50%),
      radial-gradient(ellipse at 50% 40%, #180608 0%, var(--bg) 55%, var(--bg-deep) 100%);
    animation: drift 18s ease-in-out infinite alternate;
    z-index:0;
  }
  @keyframes drift{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(-2%, 1.5%) scale(1.06); }
  }

  .stars{ position:absolute; inset:0; z-index:0; }
  .star{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:#fff; opacity:.4;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(1); }
    50%{ opacity:.85; transform:scale(1.6); }
  }

  /* ---------- floating hearts & embers ---------- */
  .embers{ position:absolute; inset:0; pointer-events:none; z-index:1; }
  .ember{
    position:absolute; bottom:-10px; border-radius:50%;
    background: var(--red-bright); opacity:.5;
    filter: drop-shadow(0 0 4px var(--red-bright));
    animation: rise linear infinite;
  }
  .float-heart{
    position:absolute; bottom:-40px; opacity:0;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 6px rgba(255,59,59,.5));
  }
  @keyframes rise{
    from{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.7; } 90%{ opacity:.35; }
    to{ transform: translateY(-110vh) translateX(var(--drift,20px)); opacity:0; }
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) rotate(0deg) scale(.6); opacity:0; }
    10%{ opacity:.85; }
    50%{ transform: translateY(-55vh) rotate(var(--rot,20deg)) scale(1); }
    90%{ opacity:.6; }
    100%{ transform: translateY(-105vh) rotate(calc(var(--rot,20deg) * -1)) scale(.8); opacity:0; }
  }

  /* cursor heart trail */
  .trail-heart{
    position:fixed; top:0; left:0; z-index:50; pointer-events:none;
    font-size:14px; color: var(--rose);
    animation: trailFade .9s ease-out forwards;
  }
  @keyframes trailFade{
    0%{ opacity:.9; transform: translate(-50%,-50%) scale(1) translateY(0); }
    100%{ opacity:0; transform: translate(-50%,-50%) scale(.4) translateY(-26px); }
  }

  /* ---------- scenes ---------- */
  .scene{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:5;
    transition: opacity .7s ease, filter .7s ease;
  }

  .ask-card{ text-align:center; padding: 40px; max-width: 92vw; position:relative; z-index:6; }

  .eyebrow{
    letter-spacing:.35em; text-transform:uppercase; font-size:11px;
    color: var(--muted); margin-bottom:16px;
  }

  .question{
    font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic;
    font-size: clamp(2rem, 6vw, 3.6rem); line-height:1.15;
    margin: 0 0 20px 0; color: var(--ink);
    text-shadow: 0 0 26px rgba(255,59,59,.35);
  }

  .pulse-heart{
    display:inline-block; color: var(--red-bright);
    animation: beat 1.3s ease-in-out infinite;
    filter: drop-shadow(0 0 10px var(--red-bright));
  }
  @keyframes beat{
    0%,100%{ transform: scale(1); } 25%{ transform: scale(1.18); }
    40%{ transform: scale(.98); } 55%{ transform: scale(1.12); }
  }

  /* love meter */
  .meter-wrap{
    width: min(340px, 70vw); margin: 0 auto 30px auto;
  }
  .meter-label{
    display:flex; justify-content:space-between; font-size:11px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;
  }
  .meter-track{
    height:6px; border-radius:999px; background: rgba(255,255,255,.08);
    overflow:hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .meter-fill{
    height:100%; width:62%;
    background: linear-gradient(90deg, var(--red-mid), var(--red-bright), var(--gold));
    border-radius:999px;
    transition: width .5s cubic-bezier(.2,.8,.3,1.2);
    box-shadow: 0 0 12px rgba(255,59,59,.6);
  }

  .choice-area{
    position:relative; display:flex; gap: 26px; justify-content:center; align-items:center; min-height: 90px;
  }

  .btn{
    font-family:'Jost', sans-serif; font-size: 1rem; letter-spacing:.04em;
    padding: 16px 40px; border-radius: 999px; border: 1px solid transparent;
    cursor:pointer; transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-yes{
    background: linear-gradient(135deg, var(--red-bright), var(--red-mid));
    color: #fff; box-shadow: 0 0 24px rgba(255,59,59,.45), inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .btn-yes:hover{ box-shadow: 0 0 34px rgba(255,59,59,.7); }
  .btn-yes:active{ transform: scale(.97) !important; }
  .btn-no{
    position:relative; background: transparent; color: var(--rose);
    border-color: rgba(255,143,163,.5);
  }
  .btn-no:hover{ background: rgba(255,143,163,.08); }

  #scene-ask.fading{ opacity:0; filter: blur(6px); pointer-events:none; }

  .hint{ margin-top: 18px; font-size: 12px; color: var(--muted); letter-spacing:.06em; min-height: 16px; }

  /* ---------- scene 2: reveal ---------- */
  #scene-reveal{ opacity:0; pointer-events:none; flex-direction:column; }
  #scene-reveal.active{ opacity:1; pointer-events:auto; }

  .heart-holder{ position:relative; }
  canvas#heartCanvas{
    display:block; max-width: 92vw; max-height: 58vh;
    animation: breathe 3.2s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); filter: drop-shadow(0 0 18px rgba(255,59,59,.35)); }
    50%{ transform: scale(1.035); filter: drop-shadow(0 0 34px rgba(255,59,59,.55)); }
  }
  .sparkle{
    position:absolute; width:5px; height:5px; border-radius:50%;
    background: var(--gold); opacity:0;
    animation: twinkleSparkle 2.6s ease-in-out infinite;
    box-shadow: 0 0 8px var(--gold);
  }
  @keyframes twinkleSparkle{
    0%,100%{ opacity:0; transform:scale(.4); }
    50%{ opacity:1; transform:scale(1.3); }
  }

  .signature-wrap{ text-align:center; margin-top: -10px; }
  .love-text{
    font-family:'Cormorant Garamond', serif; font-style:italic; letter-spacing:.5em;
    font-size: clamp(1.3rem, 4vw, 2rem); color: var(--rose);
    text-shadow: 0 0 18px rgba(255,143,163,.6);
    opacity:0; transform: translateY(8px);
    transition: opacity 1s ease, transform 1s ease; margin: 0;
  }
  .signature{
    font-family:'Great Vibes', cursive; font-size: clamp(2.3rem, 7vw, 3.8rem); color: #fff;
    text-shadow: 0 0 22px rgba(255,255,255,.5), 0 0 46px rgba(255,59,59,.5);
    opacity:0; transform: translateY(10px) scale(.96);
    transition: opacity 1.1s ease .3s, transform 1.1s ease .3s; margin: 4px 0 0 0;
  }
  .revealed .love-text{ opacity:1; transform:none; }
  .revealed .signature{ opacity:1; transform:none; }

  .replay{
    margin-top: 22px; background:none; border: 1px solid rgba(255,255,255,.25);
    color: var(--muted); padding: 10px 26px; border-radius: 999px;
    font-family:'Jost', sans-serif; font-size: 12px; letter-spacing:.15em; text-transform:uppercase;
    cursor:pointer; opacity:0; transition: opacity 1s ease .6s, color .2s ease, border-color .2s ease;
  }
  .revealed .replay{ opacity:1; }
  .replay:hover{ color: var(--ink); border-color: rgba(255,255,255,.6); }

  /* ---------- dolls ---------- */
  .doll{
    position:absolute; bottom: 18px; width: 118px; z-index:4;
    animation: bob 3.2s ease-in-out infinite;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,.5));
    transition: transform .25s ease;
  }
  .doll-left{ left: 3vw; animation-delay: .3s; }
  .doll-right{ right: 3vw; animation-delay: 0s; }
  @keyframes bob{
    0%,100%{ transform: translateY(0) rotate(-1.5deg); }
    50%{ transform: translateY(-9px) rotate(1.5deg); }
  }
  .doll .eye{ animation: blink 4.5s ease-in-out infinite; transform-origin: center; }
  .doll-right .eye{ animation-delay: .6s; }
  @keyframes blink{
    0%, 92%, 100%{ transform: scaleY(1); }
    95%{ transform: scaleY(.1); }
  }
  .doll .arm-wave{
    transform-origin: 78px 62px;
    animation: wave 2.4s ease-in-out infinite;
  }
  @keyframes wave{
    0%,100%{ transform: rotate(0deg); } 25%{ transform: rotate(-18deg); }
    50%{ transform: rotate(6deg); } 75%{ transform: rotate(-12deg); }
  }
  .doll.laugh{ animation: laughBounce .55s ease; }
  @keyframes laughBounce{
    0%{ transform: scale(1) rotate(0); }
    30%{ transform: scale(1.08,.9) rotate(-4deg); }
    60%{ transform: scale(.94,1.1) rotate(4deg); }
    100%{ transform: scale(1) rotate(0); }
  }
  .doll.cheer{ animation: cheerJump .8s ease; }
  @keyframes cheerJump{
    0%{ transform: translateY(0) scale(1); }
    30%{ transform: translateY(-28px) scale(1.06); }
    55%{ transform: translateY(0) scale(.97,1.05); }
    75%{ transform: translateY(-10px) scale(1.02); }
    100%{ transform: translateY(0) scale(1); }
  }
  @media (max-width: 640px){
    .doll{ width: 82px; bottom: 8px; }
  }

  /* ---------- confetti ---------- */
  .confetti-piece{
    position:fixed; top:-20px; z-index:40; pointer-events:none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(0) rotate(0deg); opacity:1; }
    100%{ transform: translateY(105vh) rotate(600deg); opacity:.9; }
  }

  @media (prefers-reduced-motion: reduce){
    .pulse-heart, .ember, .float-heart, .backdrop, .star, canvas#heartCanvas,
    .doll, .doll .eye, .doll .arm-wave{ animation: none !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="backdrop"></div>
  <div class="stars" id="stars"></div>
  <div class="embers" id="embers"></div>

  <!-- SCENE 1 : the question -->
  <section class="scene" id="scene-ask">

    <!-- cute dolls -->
    <svg class="doll doll-left" id="dollLeft" viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="70" cy="128" rx="34" ry="9" fill="#000" opacity=".25"/>
      <g class="arm-wave">
        <rect x="94" y="60" width="14" height="34" rx="7" fill="#c96b52"/>
      </g>
      <rect x="40" y="55" width="60" height="55" rx="24" fill="#e78a63"/>
      <circle cx="70" cy="42" r="30" fill="#f2a37c"/>
      <circle cx="46" cy="20" r="12" fill="#f2a37c"/>
      <circle cx="94" cy="20" r="12" fill="#f2a37c"/>
      <circle cx="46" cy="20" r="6" fill="#c96b52"/>
      <circle cx="94" cy="20" r="6" fill="#c96b52"/>
      <g class="eye"><circle cx="59" cy="42" r="3.4" fill="#2a1613"/></g>
      <g class="eye"><circle cx="81" cy="42" r="3.4" fill="#2a1613"/></g>
      <ellipse cx="57" cy="52" rx="6" ry="3.4" fill="#ff9d8a" opacity=".7"/>
      <ellipse cx="83" cy="52" rx="6" ry="3.4" fill="#ff9d8a" opacity=".7"/>
      <path d="M60 56 Q70 63 80 56" stroke="#7a3c26" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M50 70 Q70 80 90 70" stroke="#7a3c26" stroke-width="2" fill="none" opacity=".35"/>
    </svg>

    <svg class="doll doll-right" id="dollRight" viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="70" cy="128" rx="34" ry="9" fill="#000" opacity=".25"/>
      <g class="arm-wave" style="transform-origin:46px 62px;">
        <rect x="32" y="60" width="14" height="34" rx="7" fill="#e492a3"/>
      </g>
      <rect x="40" y="55" width="60" height="55" rx="24" fill="#ffb6c9"/>
      <circle cx="70" cy="42" r="30" fill="#ffd0dc"/>
      <path d="M40 30 Q70 -6 100 30 Q95 8 70 6 Q45 8 40 30Z" fill="#7a4630"/>
      <g class="eye"><circle cx="59" cy="43" r="3.4" fill="#3a2018"/></g>
      <g class="eye"><circle cx="81" cy="43" r="3.4" fill="#3a2018"/></g>
      <ellipse cx="57" cy="53" rx="6" ry="3.4" fill="#ff7fa0" opacity=".8"/>
      <ellipse cx="83" cy="53" rx="6" ry="3.4" fill="#ff7fa0" opacity=".8"/>
      <path d="M60 58 Q70 65 80 58" stroke="#a2445c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="70" cy="14" r="4" fill="#ff5b7a"/>
    </svg>

    <div class="ask-card">
      <div class="eyebrow">a small question,</div>
      <h1 class="question">Are you Dating <span class="pulse-heart">♥ Try to click Yes</span></h1>

      <div class="meter-wrap">
        <div class="meter-label"><span>chance you say yes</span><span id="meterPct">62%</span></div>
        <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
      </div>

      <div class="choice-area" id="choiceArea">
        <button class="btn btn-yes" id="yesBtn">No</button>
        <button class="btn btn-no" id="noBtn">Yes</button>
      </div>
      <div class="hint" id="hint">&nbsp;</div>
    </div>
  </section>

  <!-- SCENE 2 : the reveal -->
  <section class="scene" id="scene-reveal">
    <div class="heart-holder" id="heartHolder">
      <canvas id="heartCanvas" width="700" height="620"></canvas>
    </div>
    <div class="signature-wrap">
      <p class="love-text">L&nbsp;O&nbsp;V&nbsp;E</p>
      <p class="signature">craj</p>
      <button class="replay" id="replayBtn">Play again</button>
    </div>
  </section>
</div>

<script>
/* ================= starfield ================= */
(function stars(){
  const field = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.animationDuration = (2.2+Math.random()*2.4)+'s';
    field.appendChild(s);
  }
})();

/* ================= ambient embers + floating hearts ================= */
(function emberField(){
  const field = document.getElementById('embers');
  for(let i=0;i<22;i++){
    const e = document.createElement('div');
    e.className = 'ember';
    e.style.left = Math.random()*100+'vw';
    e.style.animationDuration = (6+Math.random()*7)+'s';
    e.style.animationDelay = (Math.random()*8)+'s';
    e.style.setProperty('--drift', (Math.random()*60-30)+'px');
    e.style.width = e.style.height = (1.5+Math.random()*2.5)+'px';
    field.appendChild(e);
  }
  for(let i=0;i<12;i++){
    const h = document.createElement('div');
    h.className='float-heart';
    h.innerHTML = '♥';
    h.style.left = Math.random()*100+'vw';
    h.style.fontSize = (10+Math.random()*16)+'px';
    h.style.color = Math.random()>.5 ? 'var(--red-bright)' : 'var(--rose)';
    h.style.animationDuration = (10+Math.random()*10)+'s';
    h.style.animationDelay = (Math.random()*10)+'s';
    h.style.setProperty('--rot', (Math.random()*40-20)+'deg');
    field.appendChild(h);
  }
})();

/* ================= cursor heart trail ================= */
let lastTrail = 0;
document.addEventListener('pointermove', (e) => {
  const now = performance.now();
  if(now - lastTrail < 60) return;
  lastTrail = now;
  const t = document.createElement('div');
  t.className='trail-heart';
  t.textContent='♥';
  t.style.left = e.clientX+'px';
  t.style.top = e.clientY+'px';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 900);
});

/* ================= the "No" button dodge game ================= */
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const hint = document.getElementById('hint');
const meterFill = document.getElementById('meterFill');
const meterPct = document.getElementById('meterPct');
const dollLeft = document.getElementById('dollLeft');
const dollRight = document.getElementById('dollRight');

const dodgeLines = [
  "not so fast…",
  "nice try",
  "you can't click that",
  "keep trying!",
  "almost… nope",
  "this button doesn't want to be clicked",
  "the dolls are laughing at you",
  "yes is right there though"
];
let dodgeCount = 0;
let meterValue = 62;
let noIsFixed = false;

function bounceDolls(){
  [dollLeft, dollRight].forEach(d=>{
    d.classList.remove('laugh');
    void d.offsetWidth; // restart animation
    d.classList.add('laugh');
  });
}

function dodge(){
  dodgeCount++;

  if(!noIsFixed){
    const rect = noBtn.getBoundingClientRect();
    noBtn.style.position = 'fixed';
    noBtn.style.left = rect.left + 'px';
    noBtn.style.top = rect.top + 'px';
    noBtn.style.margin = '0';
    noBtn.style.zIndex = 20;
    noIsFixed = true;
  }

  const margin = 24;
  const w = noBtn.offsetWidth;
  const h = noBtn.offsetHeight;
  const maxX = window.innerWidth - w - margin;
  const maxY = window.innerHeight - h - margin;
  const x = margin + Math.random() * Math.max(0, maxX - margin);
  const y = margin + Math.random() * Math.max(0, maxY - margin);

  noBtn.style.left = x + 'px';
  noBtn.style.top = y + 'px';

  const growYes = Math.min(1.5, 1 + dodgeCount * 0.045);
  yesBtn.style.transform = `scale(${growYes})`;
  const shrinkNo = Math.max(0.55, 1 - dodgeCount * 0.03);
  noBtn.style.transform = `scale(${shrinkNo})`;

  meterValue = Math.min(99, meterValue + 3.5);
  meterFill.style.width = meterValue + '%';
  meterPct.textContent = Math.round(meterValue) + '%';

  hint.textContent = dodgeLines[Math.min(dodgeCount-1, dodgeLines.length-1)];
  bounceDolls();
}

noBtn.addEventListener('mouseenter', dodge);
noBtn.addEventListener('click', (e) => { e.preventDefault(); dodge(); });
noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodge(); }, { passive:false });

/* ================= confetti ================= */
function burstConfetti(){
  const colors = ['#ff3b3b','#ff8fa3','#ffcf8f','#ffffff','#b3122a'];
  const n = 60;
  for(let i=0;i<n;i++){
    const c = document.createElement('div');
    c.className='confetti-piece';
    const size = 6 + Math.random()*7;
    const isRound = Math.random() > .5;
    c.style.left = Math.random()*100+'vw';
    c.style.width = size+'px';
    c.style.height = (isRound? size : size*1.6)+'px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius = isRound ? '50%' : '2px';
    c.style.animationDuration = (2.6+Math.random()*2)+'s';
    c.style.animationDelay = (Math.random()*.6)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5200);
  }
}

/* ================= scene transition ================= */
const sceneAsk = document.getElementById('scene-ask');
const sceneReveal = document.getElementById('scene-reveal');

yesBtn.addEventListener('click', () => {
  sceneAsk.classList.add('fading');
  dollLeft.classList.add('cheer');
  dollRight.classList.add('cheer');
  burstConfetti();
  setTimeout(() => {
    sceneReveal.classList.add('active');
    drawHeart();
  }, 500);
});

document.getElementById('replayBtn').addEventListener('click', () => {
  sceneReveal.classList.remove('active','revealed');
  sceneAsk.classList.remove('fading');
  dodgeCount = 0; meterValue = 62; noIsFixed = false;
  meterFill.style.width = '62%'; meterPct.textContent = '62%';
  noBtn.style.position = ''; noBtn.style.left = ''; noBtn.style.top = ''; noBtn.style.transform = '';
  yesBtn.style.transform = '';
  hint.textContent = '\u00A0';
  document.getElementById('heartCanvas').getContext('2d').clearRect(0,0,700,620);
  document.querySelectorAll('.sparkle').forEach(s=>s.remove());
});

/* ================= woven heart animation (canvas) ================= */
function heartPoint(t, scale){
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return [x*scale, y*scale];
}
function lerpColor(c1, c2, f){
  return [
    Math.round(c1[0] + (c2[0]-c1[0])*f),
    Math.round(c1[1] + (c2[1]-c1[1])*f),
    Math.round(c1[2] + (c2[2]-c1[2])*f)
  ];
}

function spawnSparkles(){
  const holder = document.getElementById('heartHolder');
  const rect = holder.getBoundingClientRect();
  for(let i=0;i<16;i++){
    const s = document.createElement('div');
    s.className='sparkle';
    const angle = Math.random()*Math.PI*2;
    const radius = 90 + Math.random()*130;
    const cx = rect.width/2 + Math.cos(angle)*radius;
    const cy = rect.height/2 + Math.sin(angle)*radius*0.9;
    s.style.left = cx+'px';
    s.style.top = cy+'px';
    s.style.animationDelay = (Math.random()*2.4)+'s';
    s.style.animationDuration = (1.8+Math.random()*2)+'s';
    holder.appendChild(s);
  }
}

function drawHeart(){
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width, canvas.height);

  const cx = canvas.width/2;
  const cy = canvas.height/2 - 10;
  const SCALE = 11;
  const LAYERS = 45;
  const MAX_ROT = 26 * Math.PI/180;
  const STEPS = 200;
  const bright = [255,59,59];
  const deep = [45,0,4];

  let layer = 0;
  function drawLayer(){
    if(layer >= LAYERS){
      sceneReveal.classList.add('revealed');
      spawnSparkles();
      return;
    }
    const frac = layer/(LAYERS-1);
    const rot = -MAX_ROT + 2*MAX_ROT*frac;
    const col = lerpColor(bright, deep, frac);

    ctx.beginPath();
    for(let i=0;i<=STEPS;i++){
      const t = (i/STEPS) * Math.PI * 2;
      let [x,y] = heartPoint(t, SCALE);
      const xr = x*Math.cos(rot) - y*Math.sin(rot);
      const yr = x*Math.sin(rot) + y*Math.cos(rot);
      const px = cx + xr;
      const py = cy - yr + 30;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]}, 0.9)`;
    ctx.lineWidth = 1.4;
    ctx.shadowColor = `rgba(255,59,59,0.35)`;
    ctx.shadowBlur = 6;
    ctx.stroke();

    layer++;
    requestAnimationFrame(drawLayer);
  }
  drawLayer();
}
</script>
